    paths:
    - items[].status
  target: NONE
  evidence: 'The status of the order item: * `CANCELLATION_ERROR`: an error occurred while processing a cancellation. This status is temporary and will change to either `OK` or `REFUNDED` after examination by Musement Customer Care * `KO`: there was an issue finalizing the order item * `OK`: the order item is valid * `PENDING`: the order item''s payment and confirmation are in progress * `REFUND_STARTED`: a refund request for the item is being processed. This status is temporary and will change to `REFUNDED` once the request has been resolved * `REFUNDED`: the order item has been cancelled and either partially or fully refunded'
