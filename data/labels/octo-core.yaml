# Gold labels for octo-core (dev spec), generated from the locked spec (sha256 02a6de6a...).
# Method (ADR-001 Amendment 4): entries drafted by Claude against schema v2, reviewed and corrected
# by Nicholas Daniel Wijaya. Blind sample of 10 entries (seed 20261016) labelled by hand before review.
# source + evidence are copied verbatim (deterministic extraction). Do not edit evidence.
# Scope: booking create (POST /bookings, POST /bookings/{uuid}/confirm) and get (GET /bookings/{uuid}).
# Embedded catalogue objects echoed in the booking (product.*, option.*, unitItems[].unit.*) are out of scope;
# their ids at booking level (productId, optionId, unitItems[].unitId) are labelled.

# ---------------- POST /bookings (request)
- source:
    endpoint: 'POST /bookings'
    direction: request
    paths: ['uuid']
  # type: string/uuid
  target: 'NONE'
  kind: ''
  evidence: 'A unique UUID to identify the booking. Setting this value acts like an idempotency key preventing you from double booking.'

- source:
    endpoint: 'POST /bookings'
    direction: request
    paths: ['productId']
  # type: string
  target: 'items[].product_id'
  kind: 'direct'
  evidence: 'The product ID for this booking.'

- source:
    endpoint: 'POST /bookings'
    direction: request
    paths: ['optionId']
  # type: string
  target: 'items[].option_id'
  kind: 'direct'
  evidence: 'The option ID for this booking.'

- source:
    endpoint: 'POST /bookings'
    direction: request
    paths: ['availabilityId']
  # type: string
  target: 'items[].activity.slot_id'
  kind: 'direct'
  evidence: 'The availability ID for the selected timeslot.'

- source:
    endpoint: 'POST /bookings'
    direction: request
    paths: ['expirationMinutes']
  # type: integer
  target: 'NONE'
  kind: ''
  evidence: 'How many minutes to reserve the availability, otherwise defaults to the supplier default amount.'

- source:
    endpoint: 'POST /bookings'
    direction: request
    paths: ['notes']
  # type: string
  target: 'NONE'
  kind: ''
  evidence: 'Optional notes for the booking.'

- source:
    endpoint: 'POST /bookings'
    direction: request
    paths: ['unitItems[].uuid']
  # type: string
  target: 'NONE'
  kind: ''
  evidence: 'A unique UUID to identify the unit, same as the booking uuid except per unit.'

- source:
    endpoint: 'POST /bookings'
    direction: request
    paths: ['unitItems[].unitId']
  # type: string
