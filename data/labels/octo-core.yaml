# ---------------- GET /bookings/{uuid} (response)
- source:
    endpoint: 'GET /bookings/{uuid}'
    direction: response
    paths: ['id']
  # type: string
  target: 'partner_booking_id'
  kind: 'direct'
  evidence: 'A unique ID / UUID generated by the supplier system to identify the booking.'

- source:
    endpoint: 'GET /bookings/{uuid}'
