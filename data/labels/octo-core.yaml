    paths: ['uuid']
  # type: string/uuid
  target: 'NONE'
  kind: ''
  evidence: 'A UUID you can set when generating the booking to use as an idempotency key.'

- source:
    endpoint: 'GET /bookings/{uuid}'
    direction: response
    paths: ['testMode']
  # type: boolean
  target: 'NONE'
  kind: ''
  evidence: 'If `TRUE`, booking was created on test mode'

- source:
    endpoint: 'GET /bookings/{uuid}'
    direction: response
    paths: ['resellerReference']
  # type: string|null
  target: 'our_booking_id'
  kind: 'direct'
  evidence: 'The reference set by the Reseller. A mandatory field for resellers to be set in the booking confirmation request.'

- source:
    endpoint: 'GET /bookings/{uuid}'
    direction: response
    paths: ['supplierReference']
  # type: string|null
  target: 'partner_confirmation_code'
  kind: 'direct'
  evidence: "The Supplier's / booking platform reference."

- source:
    endpoint: 'GET /bookings/{uuid}'
    direction: response
    paths: ['status']
  # type: string
  target: 'status'
  kind: 'transform'
  transform: 'enum_map(ON_HOLD=on_hold, PENDING=pending, CONFIRMED=confirmed, REDEEMED=confirmed, CANCELLED=cancelled, EXPIRED=failed, REJECTED=failed)'
  evidence: 'The status of the booking, possible values are: `ON_HOLD` The booking is pending confirmation, this is the default value when you first create the booking. `EXPIRED` If the booking is not confirmed before the expiration hold expires, it goes into an expired state. `CONFIRMED` Once the confirmation call is made the booking is ready to be used. `CANCELLED` If the booking is cancelled. `PENDING` If the booking is pending outside availability confirmation. `REDEEMED` If the booking is already redeemed.'

- source:
    endpoint: 'GET /bookings/{uuid}'
    direction: response
    paths: ['utcCreatedAt']
  # type: string
  target: 'booked_at'
  kind: 'direct'
  evidence: 'An ISO8601 date time in UTC when the booking was created.'

