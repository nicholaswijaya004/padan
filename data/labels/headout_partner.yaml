# Label scaffold for headout-partner, generated from the locked spec.
# source + evidence are copied verbatim (deterministic extraction).
# Fill target / kind (and transform, candidate, question) by hand. Do not edit evidence.

# ---------------- V2BookingRequest (request)
- source:
    endpoint: 'POST /api/public/v2/bookings/'
    direction: request
    paths: ['productId']
  # type: string
  target: 'partner_product_id'
  kind: 'direct'
  evidence: 'The product to book. Obtain from the product listing endpoints.'

- source:
    endpoint: 'POST /api/public/v2/bookings/'
    direction: request
    paths: ['variantId']
  # type: string
  target: 'partner_item_id'
  kind: 'direct'
  evidence: "The variant (tour option) to book. Obtain from the product's variants list."

- source:
    endpoint: 'POST /api/public/v2/bookings/'
    direction: request
    paths: ['inventoryId']
  # type: string
  target: 'partner_time_slot_id'
  kind: 'direct'
  evidence: 'The specific inventory slot (time/date) to book. Obtain from the inventory listing endpoint.'

- source:
    endpoint: 'POST /api/public/v2/bookings/'
    direction: request
    paths: ['inventorySeatIds[]']
  # type: array|null
  target: 'NONE'
  kind: ''
  evidence: 'Specific seat IDs to reserve, for seatmap-based products. Omit for non-seatmap products.'

- source:
    endpoint: 'POST /api/public/v2/bookings/'
    direction: request
    paths: ['customersDetails.count']
  # type: integer
  target: 'NONE'
  kind: ''
  evidence: 'Total number of customers in this booking.'

- source:
    endpoint: 'POST /api/public/v2/bookings/'
    direction: request
    paths: ['customersDetails.customers[].personType']
  # type: string
  target: 'travellers[].traveller_type'
  kind: 'direct'
  evidence: "Pricing category for this customer (e.g., `ADULT`, `CHILD`, `SENIOR`). Must match a type defined in the variant's pricing. For seatmap products, `personType` is always `ADULT`."

- source:
    endpoint: 'POST /api/public/v2/bookings/'
    direction: request
    paths: ['customersDetails.customers[].isPrimary']
  # type: boolean
  target: 'travellers[].is_lead'
  kind: 'direct'
  evidence: 'Marks the lead customer whose contact details (name, email, phone) are used for booking confirmation and voucher delivery.'

- source:
    endpoint: 'POST /api/public/v2/bookings/'
    direction: request
    paths: ['customersDetails.customers[].inputFields[].id']
  # type: string
  target: 'travellers[].given_name, travellers[].family_name, contact.name, contact.email'
  kind: 'transform: map_travellers_fields_to_input_fields'
  evidence: 'Field identifier matching an `inputField` defined in the variant (e.g., `NAME`, `EMAIL`, `PHONE`, or a `CUSTOM_*` field).'

- source:
    endpoint: 'POST /api/public/v2/bookings/'
    direction: request
    paths: ['customersDetails.customers[].inputFields[].value']
  # type: string
  target: 'travellers[].given_name, travellers[].family_name, contact.name, contact.email'
  kind: 'transform: map_travellers_values_to_input_fields_values'
  evidence: "The customer's response for this field. Submit `PHONE` values in international format with a leading `+` and country code (e.g., `+14155551234`)."

- source:
    endpoint: 'POST /api/public/v2/bookings/'
    direction: request
    paths: ['variantInputFields[].id']
  # type: string
  target: 'custom_fields[].field_id'
  kind: 'transform: custom_fields_to_variant_input_fields'
  evidence: 'Field identifier for a booking-level field defined on the variant (e.g., `PICKUP_LOCATION`, `LANGUAGE_`).'

- source:
    endpoint: 'POST /api/public/v2/bookings/'
    direction: request
    paths: ['variantInputFields[].value']
  # type: string
  target: 'custom_fields[].field_value'
  kind: 'transform: map_custom_fields_values_to_variant_input_fields_values'
  evidence: 'The submitted value for this field.'

- source:
    endpoint: 'POST /api/public/v2/bookings/'
    direction: request
    paths: ['price.amount']
  # type: number/double
  target: 'total_price.amount'
  kind: 'direct'
  evidence: 'Total price amount for all customers combined.'

- source:
    endpoint: 'POST /api/public/v2/bookings/'
    direction: request
    paths: ['price.currencyCode']
  # type: string
  target: 'total_price.currency'
  kind: 'direct'
  evidence: 'Currency code matching the currency used when fetching inventory pricing. See [Currency Codes](/guide/enums-and-error-codes#currency-codes).'

# ---------------- V2Booking (response)
- source:
    endpoint: 'GET /api/public/v2/bookings/{bookingId}/'
    direction: response
    paths: ['bookingId']
  # type: string
  target: 'partner_booking_id'
  kind: 'direct'
  evidence: "Headout's unique identifier for this booking. Use this for all subsequent operations (capture, cancel, reschedule)."

- source:
    endpoint: 'GET /api/public/v2/bookings/{bookingId}/'
    direction: response
    paths: ['voucherId']
  # type: string
  target: 'activity.voucher_url'
  kind: 'transform: voucher_id_to_voucher_url'
  evidence: 'Identifier of the voucher issued for this booking. Pass it to [Get a voucher](/api-partner/v2/vouchers/get) to retrieve the structured voucher payload.'

- source:
    endpoint: 'GET /api/public/v2/bookings/{bookingId}/'
    direction: response
    paths: ['partnerReferenceId']
  # type: string|null
  target: 'our_booking_id'
  kind: 'direct'
  evidence: 'Your own reference ID for this booking, set when capturing via [Update Booking](/api-partner/v2/bookings/update).'

- source:
    endpoint: 'GET /api/public/v2/bookings/{bookingId}/'
    direction: response
    paths: ['variantId']
  # type: string
  target: 'partner_item_id'
  kind: 'direct'
  evidence: 'The variant (tour option) that was booked.'

- source:
    endpoint: 'GET /api/public/v2/bookings/{bookingId}/'
    direction: response
    paths: ['status']
  # type: string
  target: 'status'
  kind: 'direct'
  evidence: "Current lifecycle state of the booking. See [Booking Status](/guide/enums-and-error-codes#booking-status).\n- `UNCAPTURED`: Created but not yet captured. Does not lock inventory or price. Auto-expires to `CAPTURE_TIMEDOUT` after 1 hour.\n- `PENDING`: Payment captured — confirmed with supplier. Treat as confirmed; show to the customer as a confirmed booking.\n- `COMPLETED`: Fulfilled — tickets are available in the `tickets` array.\n- `CANCELLED`: Cancelled by partner, customer, or Headout.\n- `FAILED`: Booking failed due to a payment or system error.\n- `CAPTURE_TIMEDOUT`: Not captured within 1 hour of creation; can no longer be captured."

