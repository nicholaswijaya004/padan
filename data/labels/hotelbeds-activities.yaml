# Gold labels for hotelbeds-activities (dev spec), generated from the locked spec (sha256 a5e3a44e...).
# Method: all 21 entries labelled by hand by Nicholas Daniel Wijaya, then compared with a sealed Claude
# draft (sha256 ec2217c6...). 13/21 agreed; the 8 disagreements were adjudicated by Nicholas (all
# resolved as in the draft; preferedLanguage escalated as ASK_PARTNER).
# source + evidence are copied verbatim (deterministic extraction). Do not edit evidence.
# Scope: booking confirm request (PUT /bookings). Booking responses are not documented in this spec.
# A booking may hold several activities[]; each maps to one items[] entry (ADR-001 Amendment 5).

# ---------------- PUT /bookings (request)
- source:
    endpoint: 'PUT /bookings'
    direction: request
    paths: ['language']
  # type: string
  target: 'NONE'
  kind: ''
  evidence: '[no description; example: en]'

- source:
    endpoint: 'PUT /bookings'
