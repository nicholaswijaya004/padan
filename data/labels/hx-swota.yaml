# Gold labels for hx-swota (dev spec), from the locked pages storing-booking.html (cc629e92...) and
# retrieving.html (4b4d8ccc...). Method (ADR-001 Amendment 4): drafted by Claude against schema v2.1 (migrated to v3),
# reviewed and corrected by Nicholas Daniel Wijaya. Blind sample of 10 entries (seed 20261020) labelled
# before the draft was seen: 4/10 agreement. Review changed 4 draft rows: VoyageID -> product_id (x2) and
# PolicyInfo.Text -> ASK_PARTNER (labeller), Payment@DueDate -> ASK_PARTNER (Claude, merging a filtered split).
# source + evidence are copied verbatim from the XML examples (deterministic extraction). Do not edit evidence.
# Scope: OTA_CruiseBookRQ (create request), OTA_CruiseBookRS (create response), OTA_ResRetrieveRS (get
# response; mostly [..] placeholders in the docs). Paths come from single examples: lists only where repeated.
# ASK_PARTNER is used where the meaning depends on an undocumented code (StatusCode, PriceTypeCode,
# PaymentNumber) or on content the example hides ([..], PolicyInfo sections).

