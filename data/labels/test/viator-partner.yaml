# Test labels for viator-partner: generated by padan.sheet from sheets/viator-partner.yaml.
- source:
    endpoint: POST /booking/book
    direction: request
    paths:
    - demo
  target: NONE
  evidence: '**specifier**: `true` if this is a *demo* booking only (demos do not send any notifications, are automatically confirmed and OnRequest products become freesale products. Default value is true. Production must have `demo` set to `false`.'
- source:
    endpoint: POST /booking/book
    direction: request
    paths:
    - currencyCode
  target: net_price.currency
  kind: direct
  evidence: '**currency code** for the currency the booking will be submitted in (you will be billed in this currency)'
- source:
    endpoint: POST /booking/book
    direction: request
    paths:
    - partnerDetail.distributorRef
  target: our_booking_id
  kind: direct
  evidence: '**unique alphanumeric reference code** for the distributor - Merchant API partners must pass a `distributorRef` at the order (A.K.A. ''itinerary'') level in the `partnerDetail` object. The `distributorRef` passed must be alphanumeric and unique to bookings made by the merchant. - Passing an existing `distributorRef`: If an existing `distributorRef` is passed, the booking with the matching `distributorRef` will be returned in the response and a new booking will not be made. The fields in the response are identical to the response for a new booking.'
- source:
    endpoint: POST /booking/book
    direction: request
    paths:
    - booker.email
  target: contact.email
  kind: direct
  evidence: '**email address** of the primary contact'
- source:
    endpoint: POST /booking/book
    direction: request
    paths:
    - booker.homePhone
  target: contact.phones[]
  kind: direct
  evidence: '**phone number** (home) of the primary contact **Note**: - Must be included to enable CLC communications - You must perform some additional validation to ensure that this field is correctly formatted prior to sending the booking request. It is essential that this string include the plus (`+`) symbol at the beginning, followed by the country code, followed by the remaining numerals. Spaces, hyphens and parentheses can be included or omitted, but the string must start with the plus symbol and country code; e.g. `+61 400 580 860` - See [Supplier communications](#section/Key-concepts/Supplier-communications) for more information'
- source:
    endpoint: POST /booking/book
    direction: request
    paths:
    - booker.firstname
  target: contact.given_name
  kind: direct
  evidence: '**first name** of the primary contact'
- source:
    endpoint: POST /booking/book
    direction: request
    paths:
    - booker.surname
  target: contact.family_name
  kind: direct
  evidence: '**surname** of the primary contact'
- source:
    endpoint: POST /booking/book
    direction: request
    paths:
    - booker.title
  target: NONE
  evidence: '**title** of the primary contact'
- source:
    endpoint: POST /booking/book
    direction: request
    paths:
    - booker.cellPhoneCountryCode
    - booker.cellPhone
  target: contact.phones[]
  kind: derived
  transform: to_e164(cellPhoneCountryCode + cellPhone)
  evidence: '**country code** for the telephone number of the lead traveler **Note**: - Must be included to enable CLC communications - This string **must** include the plus (`+`) symbol at the beginning, followed by the remaining numerals. - See [Supplier communications](#section/Key-concepts/Supplier-communications) for more information'
- source:
    endpoint: POST /booking/book
    direction: request
    paths:
    - items[].partnerItemDetail.distributorItemRef
  target: NONE
  evidence: '**unique alphanumeric code** for the order (''itinerary'') (merchant API partners must pass a `distributorItemRef` into the `partnerItemDetails` object for each item in *this* object - this code can be any alphanumeric string and is defined by the distributor'
- source:
    endpoint: POST /booking/book
    direction: request
    paths:
    - items[].hotelId
  target: NONE
  evidence: '**specifer** of the hotel If [/product](#operation/product) returns `hotelPickup`: `true` and a list of hotels is available for *this* product in [/booking/hotels](#operation/bookingHotels), a `hotelId` must be captured (as per the hotel service id field); or, use an alternative `hotelId`, such as: - `"notBooked"`: the customer has not yet booked their hotel - `"notListed"`: the customer''s hotel is not listed If the customer chooses one of these options, the product supplier may need to correspond with the user to find out their pick-up location. The best way to do this is by enabling [Closed-Loop-Communication (CLC)](#section/Merchant-APIs/Supplier-communications).'
- source:
    endpoint: POST /booking/book
    direction: request
    paths:
    - items[].pickupPoint
  target: NONE
  evidence: '**details** about the hotel pick-up point (must be provided if the `hotelId` selected by the user is `''notListed''` or if no hotels are returned for *this* product in [/booking/hotels](#operation/bookingHotels) where `hotelPickup` is `true`.'
- source:
    endpoint: POST /booking/book
    direction: request
    paths:
    - items[].travelDate
  target: items[].start_date
  kind: direct
  evidence: '**date** of travel for the item in format yyyy-mm-dd'
- source:
    endpoint: POST /booking/book
    direction: request
    paths:
    - items[].productCode
  target: items[].product_id
  kind: direct
  evidence: '**unique alphanumeric identifier** of the product to be booked'
- source:
    endpoint: POST /booking/book
    direction: request
    paths:
    - items[].tourGradeCode
  target: items[].option_id
  kind: direct
  evidence: '**specifier** of the tour grade to be booked (if tour grades are supplied in [/product](#operation/product), you must allow the customer to select a tour grade code. If no tour grades are available for *this* product, set this to `''DEFAULT''`.)'
- source:
    endpoint: POST /booking/book
    direction: request
    paths:
    - items[].languageOptionCode
  target: items[].activity.service_language
  kind: derived
  transform: extract_language_code(languageOptionCode)
  evidence: '**specifier** of language service provided for this product that has been chosen for this booking (usually in the format langcode/Service eg en/SERVICE_GUIDE. If the product details service [/product](#operation/product) for the product returns a langService, this must be provided.)'
