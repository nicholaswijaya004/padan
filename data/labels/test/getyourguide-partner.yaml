- source:
    endpoint: GET /{version}/bookings/{booking_hash}
    direction: response
    paths:
    - booking.booking_hash
  target: partner_booking_id
  kind: direct
  evidence: The hash of the booking. This identifies the booking.
- source:
    endpoint: GET /{version}/bookings/{booking_hash}
    direction: response
    paths:
    - booking.booking_status
  target: ASK_PARTNER
  evidence: The status of the booking. > * `temp` the booking is temporary (added to a cart). * `unconfirmed` the booking is awaiting final confirmation by the supplier. For `free-sale` bookings this happens within a couple of minutes, for non-`free-sale` bookings this can take up to 48 hours. * `confirmed` the booking is confirmed and active. * `deleted` the booking got deleted from a cart before checkout. Only bookings in status `temp` can be deleted. * `canceled` a formerly confirmed booking got cancelled. Refunds apply here, if it got canceled within the `CancellationPolicy`. * `deleted_by_customer` same as `deleted`, with the additional information that a customer deleted the booking from the cart. * `deleted_by_daemon` same as `deleted`, with the additional information that it was automatically deleted from the cart after the `BookingExpirationTime` was reached.
  candidate: status
  question: Which booking state (cancelled, confirmed, failed, on_hold, pending) does each value of booking_status mean?
