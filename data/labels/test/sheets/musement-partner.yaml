# Target-side sheet for musement-partner (ADR-001 Amendments 4 and 6): labelled by hand, no model.
# For each canonical target, add the partner field(s) that carry it under `picks`; leave [] if none.
# A pick names an extracted field as the scaffold shows it (a filter like [id=EMAIL] is allowed):
#   picks:
#     - source: {endpoint: 'POST /orders', direction: request, paths: ['customer.email']}
#       kind: direct                # direct | transform | derived | ask
#       target: ''                  # optional: the row's target with a filter, e.g. on a fulfilment
#                                   # row 'fulfilment[kind=voucher].value', as dev gold names it
#       transform: ''               # transform and derived only, e.g. 'to_e164'
#       question: ''                # ask only: the question for the partner (target = candidate)
# Every scoped field that no pick names becomes NONE when you run `make labels SPEC=musement-partner`.

- target: 'balance_due_date'
  picks: []

- target: 'booked_at'
  picks:
    - source: { endpoint: 'GET /orders/{orderUuid}', direction: response, paths: ['date'] }
      kind: direct

- target: 'cancellable'
  picks: []

- target: 'cancellation_policy'
  picks: []

- target: 'contact.email'
  picks:
    - source: { endpoint: 'GET /orders/{orderUuid}', direction: response, paths: ['customer.email'] }
      kind: direct

- target: 'contact.family_name'
  picks:
    - source: { endpoint: 'GET /orders/{orderUuid}', direction: response, paths: ['customer.lastname'] }
      kind: direct

- target: 'contact.full_name'
  picks: []

- target: 'contact.given_name'
  picks:
    - source: { endpoint: 'GET /orders/{orderUuid}', direction: response, paths: ['customer.firstname'] }
      kind: direct

- target: 'contact.phones[]'
  picks:
    - source: { endpoint: 'GET /orders/{orderUuid}', direction: response, paths: ['customer.mobile'] }
      kind: direct

- target: 'custom_fields[]'
  picks: []

- target: 'custom_fields[].field_id'
  picks:
    - source: { endpoint: 'GET /orders/{orderUuid}', direction: response, paths: ['customer.extra_customer_data'] }
      kind: ask
      question: 'What keys does this object contain? Are they identifiers for booking questions?'

- target: 'custom_fields[].label'
  picks:
    - source: { endpoint: 'GET /orders/{orderUuid}', direction: response, paths: ['items[].extra_customer_data[].name'] }
      kind: ask
      question: 'Is this name the human-readable label of an extra customer question?'

- target: 'custom_fields[].value'
  picks:
    - source: { endpoint: 'GET /orders/{orderUuid}', direction: response, paths: ['extra_data'] }
      kind: ask
      question: 'Does this JSON contain values for booking questions?'

- target: 'fulfilment[]'
  picks: []

- target: 'fulfilment[].format'
  picks:
    - source: { endpoint: 'GET /orders/{orderUuid}', direction: response, paths: ['items[].vouchers[].url'] }
      kind: ask
      target: 'fulfilment[kind=voucher].format'
      question: 'What format does the voucher download URL provide?'

- target: 'fulfilment[].kind'
  picks:
    - source: { endpoint: 'GET /orders/{orderUuid}', direction: response, paths: ['items[].vouchers[].url'] }
      kind: derived
      transform: 'constant_voucher'
      target: 'fulfilment[kind=voucher].kind'

- target: 'fulfilment[].partner_id'
  picks: []

- target: 'fulfilment[].redeemed_at'
  picks: []

- target: 'fulfilment[].value'
  picks:
    - source: { endpoint: 'GET /orders/{orderUuid}', direction: response, paths: ['items[].vouchers[].url'] }
      kind: direct
      target: 'fulfilment[kind=voucher].value'

- target: 'hold_expires_at'
