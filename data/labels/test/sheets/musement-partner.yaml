    - source: { endpoint: 'GET /orders/{orderUuid}', direction: response, paths: ['items[].participants_info[].fan_card'] }
      kind: direct
    - source: { endpoint: 'GET /orders/{orderUuid}', direction: response, paths: ['items[].participants_info[].weight'] }
      kind: derived
      transform: 'to_string'
    - source: { endpoint: 'GET /orders/{orderUuid}', direction: response, paths: ['items[].participants_info[].phone_number'] }
