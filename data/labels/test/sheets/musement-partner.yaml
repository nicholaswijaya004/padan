- target: 'travellers[].custom_fields[].label'
  picks: []

- target: 'travellers[].custom_fields[].value'
  picks:
    - source: { endpoint: 'GET /orders/{orderUuid}', direction: response, paths: ['items[].participants_info[].salutation'] }
      kind: direct
    - source: { endpoint: 'GET /orders/{orderUuid}', direction: response, paths: ['items[].participants_info[].email'] }
      kind: direct
    - source: { endpoint: 'GET /orders/{orderUuid}', direction: response, paths: ['items[].participants_info[].passport'] }
      kind: direct
    - source: { endpoint: 'GET /orders/{orderUuid}', direction: response, paths: ['items[].participants_info[].passport_expiry_date'] }
      kind: direct
    - source: { endpoint: 'GET /orders/{orderUuid}', direction: response, paths: ['items[].participants_info[].medical_notes'] }
      kind: direct
    - source: { endpoint: 'GET /orders/{orderUuid}', direction: response, paths: ['items[].participants_info[].address'] }
