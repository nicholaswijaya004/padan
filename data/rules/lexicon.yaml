# Rule lexicon (ADR-001 E1-E5): which partner names mean which canonical targets, in which context.
# Entries were drafted by a script from the dev gold labels (Day 8) and are curated by hand: one entry
# per (targets, leaf words, context), with the dev specs it was learnt from. Leave-one-spec-out switches
# off an entry when the spec being scored is its only source. Never add an entry from a test spec.

# Entity words, in priority order: the first entity whose words appear in a parent name wins.
entities:
  traveller: [customer, customers, pax, paxes, guest, guests, traveller, travellers, traveler, travelers, participant, participants, passenger, passengers]
  contact: [contact, holder, booker]
  ticket: [ticket, tickets, unit, units]
  cabin: [cabin, cabins]
  delivery: [delivery]
  fields: [fields, questions, answers]
  voucher: [voucher, vouchers]
  slot: [availability, slot, slots, timeslot]
  item: [activity, activities, item, items, sailing, sailings]
  product: [product, products]
  option: [variant, variants, option, options, category]
  price: [price, prices, pricing, payment, payments]
  policy: [policy, policies]
  booking: [booking, bookings, reservation, reservations, order]

# Parent names made only of these words are skipped (ContactInfo.PersonName -> contact).
wrappers: [info, details, detail, list, data, selected, person, name, schedule]

# Read together with their owner: unitItems[].contact is "ticket contact", not "contact".
dependents: [contact, fields, delivery]

